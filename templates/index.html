<!DOCTYPE html>
<html>
<head>
    <title>Olivetti Face Classifier</title>
</head>
<body>

    <h1>Face Recognition App</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="image" required>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction is not none %}
        <h2>Predicted Class: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
